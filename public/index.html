<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo List</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f4f8; display: flex; justify-content: center; padding: 40px 12px; }
    .box { background: #fff; width: 100%; max-width: 480px; padding: 24px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
    h1 { margin-top: 0; text-align: center; }
    form { display: flex; gap: 8px; }
    input[type=text] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 8px 12px; border: 0; border-radius: 6px; color: #fff; cursor: pointer; background: #3b82f6; }
    #error { display: none; background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #eee; }
    li span { flex: 1; word-break: break-word; }
    li.done span { text-decoration: line-through; color: #999; }
    .done-btn { background: #22c55e; }
    .undo-btn { background: #f59e0b; }
    .del-btn { background: #ef4444; }
    #count { color: #666; font-size: 14px; text-align: center; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Todo List</h1>
    <div id="error"></div>
    <form id="form">
      <input type="text" id="text" placeholder="Add a task..." autocomplete="off" required>
      <button type="submit">Add</button>
    </form>
    <ul id="list"></ul>
    <div id="count"></div>
  </div>

  <script>
    const list = document.getElementById('list');
    const form = document.getElementById('form');
    const input = document.getElementById('text');
    const errBox = document.getElementById('error');
    const count = document.getElementById('count');

    function showError(msg) { errBox.textContent = msg; errBox.style.display = 'block'; }
    function clearError() { errBox.style.display = 'none'; }

    async function api(url, options) {
      try {
        const res = await fetch(url, options);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');
        clearError();
        return data;
      } catch (e) {
        showError(location.protocol === 'file:'
          ? 'Open this app at http://localhost:3000 (run "npm start") - do not double-click the HTML file.'
          : 'Error: ' + e.message);
        throw e;
      }
    }

    function makeButton(label, cls, onClick) {
      const b = document.createElement('button');
      b.textContent = label;
      b.className = cls;
      b.onclick = onClick;
      return b;
    }

    async function load() {
      const todos = await api('/api/todos');
      list.innerHTML = '';
      todos.forEach(t => {
        const li = document.createElement('li');
        if (t.done) li.className = 'done';

        const span = document.createElement('span');
        span.textContent = t.text;

        const toggle = makeButton(t.done ? 'Undo' : 'Done', t.done ? 'undo-btn' : 'done-btn', async () => {
          await api('/api/todos/' + t._id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ done: !t.done })
          });
          load();
        });

        const del = makeButton('Delete', 'del-btn', async () => {
          await api('/api/todos/' + t._id, { method: 'DELETE' });
          load();
        });

        li.append(span, toggle, del);
        list.appendChild(li);
      });
      const left = todos.filter(t => !t.done).length;
      count.textContent = todos.length ? left + ' of ' + todos.length + ' tasks pending' : 'No tasks yet';
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      await api('/api/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      input.value = '';
      input.focus();
      load();
    };

    load().catch(() => {});
  </script>
</body>
</html>
